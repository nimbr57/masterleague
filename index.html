<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Master League Pro 2026/27</title>

    <!-- Windowsで国旗絵文字を完全に補正表示するスクリプトとWebフォント -->
    <script src="https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/index.spec.js"></script>
    <style>
     @font-face {
         font-family: "Twemoji Country Flags";
         src: url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1/dist/TwemojiCountryFlags.woff2") format("woff2");
         unicode-range: U+1F1E6-1F1FF, U+1F3F4, U+E0061-E007A, U+E007F;
         font-display: swap;
     }

     body, button, select, input {
         font-family: "Twemoji Country Flags", -apple-system, BlinkMacSystemFont, "Segoe UI Emoji", "Apple Color Emoji", "Segoe UI", Roboto, sans-serif;
     }
    </style>

    <style>
        :root, body[data-theme="dark"] {
            --bg-color: #0b0f19;
            --panel-bg: #151d2a;
            --panel-border: #232d3f;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --card-bg: #0f172a;
            --header-bg: linear-gradient(135deg, #1e293b, #0f172a);
            --browser-bar-bg: #1e293b;
            --tab-active-bg: #151d2a;
            --tab-inactive-bg: #0f172a;
            --tab-border: #232d3f;
        }

        body[data-theme="light"] {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --panel-border: #cbd5e1;
            --accent-green: #059669;
            --accent-gold: #d97706;
            --accent-blue: #2563eb;
            --accent-red: #dc2626;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --card-bg: #f8fafc;
            --header-bg: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            --browser-bar-bg: #e2e8f0;
            --tab-active-bg: #ffffff;
            --tab-inactive-bg: #cbd5e1;
            --tab-border: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
            transition: background-color 0.2s, color 0.2s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            border: 1px solid var(--panel-border);
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 12px;
        }

        select, button {
            font-family: inherit;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 5px 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        select:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-theme {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-blue);
            color: var(--text-main);
            font-size: 0.8em;
            padding: 4px 8px;
        }

        .btn-reset {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            font-size: 0.75em;
            padding: 4px 8px;
        }
        .btn-reset:hover {
            background-color: var(--accent-red);
            color: #fff;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 12px;
        }
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid var(--panel-border);
            margin-bottom: 12px;
        }

        /* ピッチ */
        .pitch-container {
            position: relative;
            width: 100%;
            height: 310px;
            background: repeating-linear-gradient(0deg, #15803d, #15803d 25px, #166534 25px, #166534 50px);
            border: 2px solid rgba(255,255,255,0.25);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .pitch-line-center { position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.25); }
        .pitch-circle { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; border: 2px solid rgba(255,255,255,0.25); border-radius: 50%; transform: translate(-50%, -50%); }

        /* 選手カード (ベース) */
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border-radius: 5px;
            padding: 2px 4px;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s, border-color 0.1s, opacity 0.1s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        .player-card:active { cursor: grabbing; }
        .player-card.dragging { opacity: 0.4; }
        .player-card.drag-over { border: 2px dashed var(--accent-gold) !important; background: rgba(245, 158, 11, 0.2); }
        .player-card.selected { border: 2px solid var(--accent-blue) !important; box-shadow: 0 0 10px var(--accent-blue) !important; }

        /* 現役選手：青色で輝く枠 */
        .card-active-player {
            border: 1.5px solid #3b82f6 !important;
            box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
        }

        /* レジェンド選手：金色で輝く枠 (光彩アニメーション) */
        .card-legend-player {
            border: 1.5px solid #f59e0b !important;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.8);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), var(--card-bg)) !important;
            animation: legendGoldGlow 2s infinite alternate;
        }

        @keyframes legendGoldGlow {
            0% { box-shadow: 0 0 5px rgba(245, 158, 11, 0.5); }
            100% { box-shadow: 0 0 12px rgba(245, 158, 11, 1), 0 0 4px #f59e0b; }
        }

        .player-pin {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 48px;
        }

        /* 総合値バッジのカラー指定 */
        .rating-badge {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 3px;
            color: #fff;
        }
        .rating-blue { background-color: #3b82f6; }
        .rating-green { background-color: #10b981; }
        .rating-gold { background-color: #f59e0b; }
        .rating-red { background-color: #ef4444; }

        .stamina-bar-container {
            width: 85%;
            height: 3px;
            background-color: #334155;
            border-radius: 2px;
            margin-top: 2px;
            overflow: hidden;
        }
        .stamina-bar-fill {
            height: 100%;
            transition: width 0.2s;
        }

        .player-name {
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 48px;
            text-align: center;
        }

        .bench-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 4px;
            min-height: 48px;
        }
        .reserve-section {
            margin-top: 8px;
            border-top: 1px dashed var(--panel-border);
            padding-top: 6px;
        }
        .reserve-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-height: 80px;
            overflow-y: auto;
            min-height: 48px;
        }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .venue-badge {
            display: inline-block;
            font-size: 0.7em;
            font-weight: bold;
            padding: 1px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .venue-home { background: var(--accent-green); color: #fff; }
        .venue-away { background: var(--accent-red); color: #fff; }

        .win-rate-bar {
            display: flex;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 5px 0;
            background: #334155;
        }
        .rate-win { background: var(--accent-green); }
        .rate-draw { background: var(--accent-gold); }
        .rate-loss { background: var(--accent-red); }

        .match-live-screen {
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
        }
        .scoreboard { font-size: 1.4em; font-weight: bold; text-align: center; }
        .match-log {
            height: 120px;
            overflow-y: auto;
            font-size: 0.8em;
            color: var(--text-sub);
            margin-top: 6px;
            border-top: 1px dashed var(--panel-border);
            padding-top: 4px;
        }
        .log-entry { margin-bottom: 3px; text-align: left; }
        .log-goal { color: var(--accent-gold); font-weight: bold; }
        .log-card-yellow { color: #facc15; font-weight: bold; }
        .log-card-red { color: var(--accent-red); font-weight: bold; }
        .log-summary { color: var(--accent-blue); font-weight: bold; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--panel-border); }

        /* ブラウザ風 移籍市場UI */
        .browser-window {
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--panel-bg);
        }
        .browser-header {
            display: flex;
            align-items: center;
            background-color: var(--browser-bar-bg);
            padding: 6px 10px;
            gap: 10px;
            border-bottom: 1px solid var(--panel-border);
        }
        .browser-dots { display: flex; gap: 5px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .browser-address-bar {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            padding: 2px 10px;
            font-size: 0.72em;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .browser-tabs {
            display: flex;
            background-color: var(--browser-bar-bg);
            border-bottom: 1px solid var(--panel-border);
            overflow-x: auto;
            padding: 4px 6px 0 6px;
            gap: 3px;
        }
        .browser-tab {
            background: var(--tab-inactive-bg);
            border: 1px solid var(--tab-border);
            border-bottom: none;
            color: var(--text-sub);
            padding: 5px 12px;
            font-size: 0.75em;
            font-weight: bold;
            cursor: pointer;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .browser-tab.active {
            background: var(--tab-active-bg);
            color: var(--text-main);
            border-color: var(--panel-border);
            border-bottom: 1px solid var(--tab-active-bg);
            margin-bottom: -1px;
        }
        .browser-tab.legend-tab {
            color: var(--accent-gold);
        }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding: 8px;
        }
        .market-card {
            background: var(--card-bg);
            padding: 6px;
            border-radius: 5px;
            font-size: 0.78em;
        }

        .tab-menu { display: flex; gap: 4px; margin-bottom: 6px; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--panel-border); color: var(--text-sub); padding: 4px 8px; font-size: 0.78em; cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: var(--accent-blue); color: #fff; }

        table { width: 100%; border-collapse: collapse; font-size: 0.75em; }
        th, td { padding: 4px 2px; text-align: center; border-bottom: 1px solid var(--panel-border); }
        th { background: var(--card-bg); color: var(--text-sub); }
        tr.my-team-row { background: rgba(16, 185, 129, 0.15); font-weight: bold; }
    </style>
</head>
<body>

    <script src="data.js"></script>

    <div class="header">
        <div>
            <span style="font-size:0.7em; color:var(--text-sub);">クラブ選択 (欧州強豪10)</span><br>
            <select id="team-select" onchange="selectMyTeam()">
                <option value="レアル・マドリード">レアル・マドリード</option>
                <option value="マンチェスター・C">マンチェスター・C</option>
                <option value="バルセロナ">バルセロナ</option>
                <option value="アーセナル">アーセナル</option>
                <option value="バイエルン">バイエルン</option>
                <option value="ドルトムント">ドルトムント</option>
                <option value="チェルシー">チェルシー</option>
                <option value="パリサンジェルマン">パリサンジェルマン</option>
                <option value="インテルナツィオナーレ・ミラノ">インテル</option>
                <option value="ACミラン">ACミラン</option>
            </select>
        </div>
        <div>
            <span style="font-size:0.7em; color:var(--text-sub);">監督 (切り替え)</span><br>
            <select id="manager-select" onchange="switchManager()" style="font-size:0.85em; max-width:140px;"></select>
            <span style="font-size:0.75em; color:var(--accent-gold);" id="manager-rating"></span>
        </div>
        <div>
            <span style="font-size:0.7em; color:var(--text-sub);">所属リーグ</span><br>
            <strong style="font-size:1em; color:var(--accent-blue);">欧州スーパーリーグ 26/27</strong>
        </div>
        <div>
            <span style="font-size:0.7em; color:var(--text-sub);">シーズン / 節 (全20節)</span><br>
            <strong>S<span id="season">1</span> - 第<span id="week">1</span>節</strong>
        </div>
        <div>
            <span style="font-size:0.7em; color:var(--text-sub);">資金 / 実効OVR</span><br>
            <strong style="color:var(--accent-green);">$<span id="funds">2500</span>M</strong> / 
            <strong style="color:var(--accent-gold);" id="team-rating">0</strong>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
            <button class="btn-theme" id="theme-toggle-btn" onclick="toggleTheme()">☀️ ライト</button>
            <button class="btn-reset" onclick="confirmResetAllData()">データ全削除</button>
        </div>
    </div>

    <div id="offer-banner"></div>

    <div class="main-layout">
        
        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <h4 style="margin:0; display:flex; align-items:center; gap:6px;">
                    スカッド編成
                    <span style="font-size:0.75em; font-weight:normal; color:var(--accent-gold);">
                        (チームOVR: <span id="squad-team-rating">0</span>)
                    </span>
                </h4>
                <select id="formation-select" onchange="changeFormation()" style="font-size:0.75em;">
                    <option value="4-2-3-1" selected>4-2-3-1</option>
                    <option value="4-3-3">4-3-3</option>
                    <option value="4-4-2">4-4-2</option>
                    <option value="3-5-2">3-5-2</option>
                    <option value="3-4-3">3-4-3</option>
                    <option value="4-1-4-1">4-1-4-1</option>
                    <option value="4-3-2-1">4-3-2-1</option>
                    <option value="5-3-2">5-3-2</option>
                </select>
            </div>

            <div class="pitch-container" id="pitch">
                <div class="pitch-line-center"></div>
                <div class="pitch-circle"></div>
            </div>

            <div>
                <strong style="font-size:0.75em; color:var(--accent-gold);">ベンチ (サブ)</strong>
                <div class="bench-grid" id="bench-container"></div>
            </div>

            <div class="reserve-section">
                <strong style="font-size:0.75em; color:var(--text-sub);">ベンチ外 (リザーブ)</strong>
                <div class="reserve-list" id="reserve-container"></div>
            </div>

            <div id="player-action-panel" style="margin-top: 8px; display:none; background:var(--card-bg); padding:8px; border-radius:6px; border:1px solid var(--panel-border);">
                <div id="selected-player-info" style="font-size:0.8em; font-weight:bold; margin-bottom:6px; text-align:center;"></div>
                <div style="display:flex; gap:6px;">
                    <button id="btn-train-player" style="flex:1; padding:6px; background:var(--accent-blue);" onclick="trainSelectedPlayer()">育成</button>
                    <button id="btn-sell-player" style="flex:1; padding:6px; background:var(--accent-red);" onclick="sellSelectedPlayer()">放出</button>
                </div>
            </div>
        </div>

        <div>
            <div class="panel">
                <h4 style="margin:0 0 6px 0;">マッチセンター</h4>
                <div class="match-card">
                    <div id="venue-indicator" class="venue-badge venue-home">HOME</div>
                    <div style="font-size:1em; font-weight:bold;">
                        <span id="my-team-disp">---</span> vs <span id="enemy-name">---</span>
                    </div>
                    <div style="font-size:0.75em; color:var(--text-sub);">敵OVR: <span id="enemy-rating">0</span></div>

                    <div style="margin-top:4px;">
                        <div style="font-size:0.7em; display:flex; justify-content:space-between; color:var(--text-sub);">
                            <span>勝 <span id="rate-win-txt">0</span>%</span>
                            <span>分 <span id="rate-draw-txt">0</span>%</span>
                            <span>負 <span id="rate-loss-txt">0</span>%</span>
                        </div>
                        <div class="win-rate-bar">
                            <div class="rate-win" id="bar-win" style="width:33%"></div>
                            <div class="rate-draw" id="bar-draw" style="width:33%"></div>
                            <div class="rate-loss" id="bar-loss" style="width:34%"></div>
                        </div>
                    </div>

                    <button id="btn-start-match" style="width:100%; margin-top:4px; padding:6px; background:var(--accent-green);" onclick="startMatchSimulation()">試合開始 (キックオフ)</button>
                </div>

                <div class="match-live-screen">
                    <div style="font-size:0.75em; color:var(--accent-gold); text-align:center;" id="match-timer">00:00</div>
                    <div class="scoreboard">
                        <span id="score-my">0</span> - <span id="score-enemy">0</span>
                    </div>
                    <div class="match-log" id="match-log">
                        <div class="log-entry">キックオフを待っています...</div>
                    </div>
                </div>
            </div>

            <!-- ブラウザ風 移籍市場 -->
            <div class="panel" style="padding:0; overflow:hidden;">
                <div class="browser-window">
                    <div class="browser-header">
                        <div class="browser-dots">
                            <span class="dot red"></span>
                            <span class="dot yellow"></span>
                            <span class="dot green"></span>
                        </div>
                        <div class="browser-address-bar">
                            🔒 https://transfer-market.football-master.league/2026
                        </div>
                        <button onclick="toggleMarketPanel()" style="font-size:0.7em; padding:2px 6px;">開閉 <span id="market-toggle-icon">▼</span></button>
                    </div>

                    <div class="browser-tabs" id="market-tabs">
                        <button class="browser-tab active" id="mtab-ALL" onclick="setMarketCategory('ALL')">すべて</button>
                        <button class="browser-tab" id="mtab-FW" onclick="setMarketCategory('FW')">FW</button>
                        <button class="browser-tab" id="mtab-MF" onclick="setMarketCategory('MF')">MF</button>
                        <button class="browser-tab" id="mtab-DF" onclick="setMarketCategory('DF')">DF</button>
                        <button class="browser-tab" id="mtab-GK" onclick="setMarketCategory('GK')">GK</button>
                        <button class="browser-tab legend-tab" id="mtab-LEGEND" onclick="setMarketCategory('LEGEND')">👑 レジェンド</button>
                        <button class="browser-tab" id="mtab-MANAGER" onclick="setMarketCategory('MANAGER')">👔 監督</button>
                    </div>

                    <div class="market-grid" id="market-grid"></div>
                </div>
            </div>

            <div class="panel">
                <div class="tab-menu">
                    <button class="tab-btn active" id="tab-standings" onclick="switchViewTab('standings')">順位表</button>
                    <button class="tab-btn" id="tab-goals" onclick="switchViewTab('goals')">得点王</button>
                    <button class="tab-btn" id="tab-assists" onclick="switchViewTab('assists')">アシスト王</button>
                    <button class="tab-btn" id="tab-cards" onclick="switchViewTab('cards')">警告/退場</button>
                </div>
                <div id="view-container"></div>
            </div>
        </div>

    </div>

    <script>
        const STORAGE_KEY = "ML_PRO_SAVE_DATA_2026_V6";
        const THEME_KEY = "ML_PRO_THEME_PREF";

        let transferMarket = JSON.parse(JSON.stringify(defaultTransferMarket));
        let myStarters = [], myBench = [], myReserves = [];
        let playerStats = {}, standings = [];

        let gameState = {
            teamName: "レアル・マドリード",
            currentFormation: "4-2-3-1",
            season: 1, week: 1, funds: 2500,
            activeTab: 'standings', isMatchRunning: false,
            manager: null,
            myManagers: [],
            managerMarket: [],
            saleOffer: false, saleOfferWeeks: 0,
            buyOffer: false, buyOfferWeeks: 0,
            merchOffer: false,
            isMarketOpen: true,
            marketCategory: 'ALL'
        };

        let draggedSource = null, selectedPlayer = null;

        /* テーマ切り替え機能 */
        function initTheme() {
            let theme = localStorage.getItem(THEME_KEY);
            if (!theme) {
                theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            applyTheme(theme);
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const btn = document.getElementById('theme-toggle-btn');
            if (btn) {
                btn.innerText = theme === 'dark' ? '☀️ ライト' : '🌙 ダーク';
            }
        }

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme') || 'dark';
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function getRatingClass(rating) {
            if (rating >= 90) return "rating-blue";
            if (rating >= 80) return "rating-green";
            if (rating >= 70) return "rating-gold";
            return "rating-red";
        }

        function getCardGlowClass(player) {
            if (player && player.isLegend) return "card-legend-player";
            return "card-active-player";
        }

        function getStaminaColor(stamina) {
            if (stamina >= 70) return "#10b981";
            if (stamina >= 35) return "#f59e0b";
            return "#ef4444";
        }

        function ensurePlayerDefaults(p) {
            if (p.stamina === undefined) p.stamina = 100;
            if (p.injuryWeeks === undefined) p.injuryWeeks = 0;
            if (p.suspendedWeeks === undefined) p.suspendedWeeks = 0;
            return p;
        }

        function isPlayerUnavailable(p) {
            return (p && (p.injuryWeeks > 0 || p.suspendedWeeks > 0));
        }

        function getStatusBadgeHtml(p) {
            if (p.injuryWeeks > 0) {
                return `<div style="font-size:7px; color:var(--accent-red); font-weight:bold;">🚑ケガ(${p.injuryWeeks}節)</div>`;
            }
            if (p.suspendedWeeks > 0) {
                return `<div style="font-size:7px; color:var(--accent-red); font-weight:bold;">🟥停止(${p.suspendedWeeks}節)</div>`;
            }
            return '';
        }

        /* 出場不可(ケガ・レッドカード)発生時の自チーム人数安全保持ロジック */
        function autoFixSquadForUnavailable() {
            let all = [...myStarters, ...myBench, ...myReserves];
            all.forEach(ensurePlayerDefaults);

            let availableCount = all.filter(p => !isPlayerUnavailable(p)).length;
            let youthIndex = 1;
            while (availableCount < 16) {
                const youthPlayer = {
                    name: `ユース選手${youthIndex++}`,
                    pos: "CMF",
                    altPos: ["DMF", "AMF"],
                    category: "MF",
                    rating: 70,
                    stamina: 100,
                    injuryWeeks: 0,
                    suspendedWeeks: 0
                };
                myReserves.push(youthPlayer);
                all.push(youthPlayer);
                availableCount++;
            }

            for (let i = 0; i < myStarters.length; i++) {
                if (isPlayerUnavailable(myStarters[i])) {
                    let benchIdx = myBench.findIndex(p => !isPlayerUnavailable(p));
                    if (benchIdx !== -1) {
                        let temp = myStarters[i];
                        myStarters[i] = myBench[benchIdx];
                        myBench[benchIdx] = temp;
                    } else {
                        let resIdx = myReserves.findIndex(p => !isPlayerUnavailable(p));
                        if (resIdx !== -1) {
                            let temp = myStarters[i];
                            myStarters[i] = myReserves[resIdx];
                            myReserves[resIdx] = temp;
                        }
                    }
                }
            }

            for (let i = 0; i < myBench.length; i++) {
                if (isPlayerUnavailable(myBench[i])) {
                    let resIdx = myReserves.findIndex(p => !isPlayerUnavailable(p));
                    if (resIdx !== -1) {
                        let temp = myBench[i];
                        myBench[i] = myReserves[resIdx];
                        myReserves[resIdx] = temp;
                    }
                }
            }
        }

        function saveGameState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                gameState, myStarters, myBench, myReserves, transferMarket, playerStats, standings
            }));
        }

        function loadGameState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            try {
                const data = JSON.parse(saved);
                gameState = data.gameState;
                gameState.isMatchRunning = false;
                if (gameState.isMarketOpen === undefined) gameState.isMarketOpen = true;
                if (!gameState.marketCategory) gameState.marketCategory = 'ALL';
                if (gameState.merchOffer === undefined) gameState.merchOffer = false;

                if (!gameState.myManagers || gameState.myManagers.length === 0) {
                    gameState.myManagers = gameState.manager ? [gameState.manager] : [initialManagers[gameState.teamName]];
                }
                if (!gameState.manager) {
                    gameState.manager = gameState.myManagers[0];
                }
                if (!gameState.managerMarket || gameState.managerMarket.length === 0) {
                    gameState.managerMarket = JSON.parse(JSON.stringify(freeManagers));
                }

                myStarters = (data.myStarters || []).map(ensurePlayerDefaults);
                myBench = (data.myBench || []).map(ensurePlayerDefaults);
                myReserves = (data.myReserves || []).map(ensurePlayerDefaults);
                transferMarket = (data.transferMarket || []).map(ensurePlayerDefaults);
                playerStats = data.playerStats;
                standings = data.standings;

                document.getElementById('team-select').value = gameState.teamName;
                document.getElementById('formation-select').value = gameState.currentFormation;
                return true;
            } catch (e) { return false; }
        }

        function confirmResetAllData() {
            if (confirm("すべてのデータを初期化しますか？") && confirm("本当に削除しますか？")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function toggleMarketPanel() {
            gameState.isMarketOpen = !gameState.isMarketOpen;
            const grid = document.getElementById('market-grid');
            const icon = document.getElementById('market-toggle-icon');
            if (gameState.isMarketOpen) {
                grid.style.display = 'grid';
                icon.innerText = '▼';
            } else {
                grid.style.display = 'none';
                icon.innerText = '▲';
            }
            saveGameState();
        }

        function setMarketCategory(category) {
            gameState.marketCategory = category;
            document.querySelectorAll('.browser-tab').forEach(t => t.classList.remove('active'));
            const activeTab = document.getElementById(`mtab-${category}`);
            if (activeTab) activeTab.classList.add('active');
            renderMarket();
            saveGameState();
        }

        function getStat(name, team) {
            if (!playerStats[name]) playerStats[name] = { name, team, goals: 0, assists: 0, yellow: 0, red: 0 };
            return playerStats[name];
        }

        function getEffectivePlayer(player, slotInfo) {
            ensurePlayerDefaults(player);
            if (!slotInfo) return { ...player, effectiveRating: player.rating, penalty: 0 };

            let penalty = 0;
            const isMainMatch = player.pos === slotInfo.pos;
            const isAltMatch = player.altPos && player.altPos.includes(slotInfo.pos);

            if (isMainMatch || isAltMatch) {
                penalty = 0;
            } else if (player.category === slotInfo.category) {
                penalty = -5;
            } else {
                penalty = -15;
            }

            const staminaLoss = Math.floor((100 - player.stamina) * 0.12);

            return {
                ...player,
                effectiveRating: Math.max(40, player.rating + penalty - staminaLoss),
                penalty
            };
        }

        function autoAlignToFormation(players, formKey) {
            const slots = formations[formKey];
            let pool = JSON.parse(JSON.stringify(players)).map(ensurePlayerDefaults);
            let starters = [];

            slots.forEach(slot => {
                let idx = pool.findIndex(p => p.pos === slot.pos);
                if (idx === -1) idx = pool.findIndex(p => p.altPos && p.altPos.includes(slot.pos));
                if (idx === -1) idx = pool.findIndex(p => p.category === slot.category);
                if (idx === -1) idx = 0;

                starters.push(pool.splice(idx, 1)[0]);
            });

            return { starters, bench: pool.splice(0, 5), reserves: pool };
        }

        function selectMyTeam() {
            if (gameState.week > 1 || gameState.season > 1) return;
            gameState.teamName = document.getElementById('team-select').value;
            const presetAll = clubPresetData[gameState.teamName];
            const aligned = autoAlignToFormation(presetAll, gameState.currentFormation);

            myStarters = aligned.starters;
            myBench = aligned.bench;
            myReserves = aligned.reserves;

            const initM = initialManagers[gameState.teamName];
            gameState.myManagers = [initM];
            gameState.manager = initM;
            gameState.managerMarket = JSON.parse(JSON.stringify(freeManagers));

            initStandings();
            updateUI();
        }

        function initStandings() {
            standings = Object.keys(clubPresetData).map(tName => ({
                name: tName, 
                points: 0, played: 0, win: 0, draw: 0, loss: 0,
                gf: 0, ga: 0, gd: 0,
                rating: Math.round(clubPresetData[tName].slice(0, 11).reduce((a,b)=>a+b.rating,0)/11),
                isUser: tName === gameState.teamName
            }));
        }

        function changeFormation() {
            gameState.currentFormation = document.getElementById('formation-select').value;
            const aligned = autoAlignToFormation([...myStarters, ...myBench, ...myReserves], gameState.currentFormation);
            myStarters = aligned.starters; myBench = aligned.bench; myReserves = aligned.reserves;
            updateUI();
        }

        function calculateStarterRating() {
            const slots = formations[gameState.currentFormation];
            let sum = 0;
            let legendCount = 0;

            myStarters.forEach((p, idx) => {
                ensurePlayerDefaults(p);
                sum += getEffectivePlayer(p, slots[idx]).effectiveRating;
                if (p.isLegend) legendCount++;
            });
            let base = Math.round(sum / myStarters.length);
            
            let managerBonus = gameState.manager ? Math.floor((gameState.manager.rating - 80) / 2) : 0;
            let legendBonus = legendCount * 2;

            return base + managerBonus + legendBonus;
        }

        function renderSquad() {
            autoFixSquadForUnavailable();

            const pitch = document.getElementById('pitch');
            pitch.querySelectorAll('.player-pin').forEach(p => p.remove());
            const slots = formations[gameState.currentFormation];

            myStarters.forEach((player, idx) => {
                ensurePlayerDefaults(player);
                const slot = slots[idx];
                const eff = getEffectivePlayer(player, slot);
                const isSelected = selectedPlayer && selectedPlayer.type === 'starter' && selectedPlayer.index === idx;
                const glowClass = getCardGlowClass(player);
                const statusBadge = getStatusBadgeHtml(player);

                const pin = document.createElement('div');
                pin.className = `player-card player-pin ${glowClass} ${isSelected ? 'selected' : ''}`;
                pin.style.left = `${slot.x}%`;
                pin.style.top = `${slot.y}%`;
                pin.draggable = !gameState.isMatchRunning;
                if (isPlayerUnavailable(player)) pin.style.opacity = '0.6';

                attachDragEvents(pin, 'starter', idx);
                pin.onclick = () => handlePlayerClick('starter', idx);

                let badgeClass = getRatingClass(eff.effectiveRating);

                pin.innerHTML = `
                    <div style="font-size:7px; color:var(--text-sub);">${slot.pos}</div>
                    <div class="player-name">${player.name}</div>
                    ${statusBadge ? statusBadge : `<span class="rating-badge ${badgeClass}">${eff.effectiveRating}</span>`}
                    <div class="stamina-bar-container">
                        <div class="stamina-bar-fill" style="width:${player.stamina}%; background-color:${getStaminaColor(player.stamina)};"></div>
                    </div>
                `;
                pitch.appendChild(pin);
            });

            const benchContainer = document.getElementById('bench-container');
            benchContainer.innerHTML = '';
            myBench.forEach((player, idx) => {
                ensurePlayerDefaults(player);
                const card = document.createElement('div');
                const glowClass = getCardGlowClass(player);
                const statusBadge = getStatusBadgeHtml(player);

                card.className = `player-card ${glowClass} ${selectedPlayer && selectedPlayer.type === 'bench' && selectedPlayer.index === idx ? 'selected' : ''}`;
                card.draggable = !gameState.isMatchRunning;
                if (isPlayerUnavailable(player)) card.style.opacity = '0.6';

                attachDragEvents(card, 'bench', idx);
                card.onclick = () => handlePlayerClick('bench', idx);

                let badgeClass = getRatingClass(player.rating);
                card.innerHTML = `
                    <div style="font-size:7px; color:var(--accent-gold); font-weight:bold;">${player.pos}</div>
                    <div class="player-name">${player.name}</div>
                    ${statusBadge ? statusBadge : `<span class="rating-badge ${badgeClass}">${player.rating}</span>`}
                    <div class="stamina-bar-container">
                        <div class="stamina-bar-fill" style="width:${player.stamina}%; background-color:${getStaminaColor(player.stamina)};"></div>
                    </div>
                `;
                benchContainer.appendChild(card);
            });

            const reserveContainer = document.getElementById('reserve-container');
            reserveContainer.innerHTML = '';
            myReserves.forEach((player, idx) => {
                ensurePlayerDefaults(player);
                const card = document.createElement('div');
                const glowClass = getCardGlowClass(player);
                const statusBadge = getStatusBadgeHtml(player);

                card.className = `player-card ${glowClass} ${selectedPlayer && selectedPlayer.type === 'reserve' && selectedPlayer.index === idx ? 'selected' : ''}`;
                card.style.minWidth = '52px';
                card.draggable = !gameState.isMatchRunning;
                if (isPlayerUnavailable(player)) card.style.opacity = '0.6';

                attachDragEvents(card, 'reserve', idx);
                card.onclick = () => handlePlayerClick('reserve', idx);

                let badgeClass = getRatingClass(player.rating);
                card.innerHTML = `
                    <div style="font-size:7px; color:var(--text-sub);">${player.pos}</div>
                    <div class="player-name">${player.name}</div>
                    ${statusBadge ? statusBadge : `<span class="rating-badge ${badgeClass}">${player.rating}</span>`}
                    <div class="stamina-bar-container">
                        <div class="stamina-bar-fill" style="width:${player.stamina}%; background-color:${getStaminaColor(player.stamina)};"></div>
                    </div>
                `;
                reserveContainer.appendChild(card);
            });

            attachContainerDragEvents(pitch, 'starter');
            attachContainerDragEvents(benchContainer, 'bench');
            attachContainerDragEvents(reserveContainer, 'reserve');

        }

        function renderPlayerActionPanel() {
            const actionPanel = document.getElementById('player-action-panel');
            if (!actionPanel) return;

            if (!selectedPlayer) {
                actionPanel.style.display = 'none';
                return;
            }

            const list = getList(selectedPlayer.type);
            const player = list[selectedPlayer.index];
            if (!player) {
                selectedPlayer = null;
                actionPanel.style.display = 'none';
                return;
            }

            actionPanel.style.display = 'block';

            const trainCost = Math.floor(player.rating * 2);
            const mult = gameState.saleOffer ? 1.5 : 1.0;
            const sellPrice = Math.floor(player.rating * 8 * mult);
            const offerTxt = gameState.saleOffer ? " 🔥1.5倍!" : "";

            const infoEl = document.getElementById('selected-player-info');
            infoEl.innerHTML = `<span style="color:var(--accent-gold);">${player.name}</span> (${player.pos} | OVR:${player.rating} | STA:${player.stamina}%)`;

            const trainBtn = document.getElementById('btn-train-player');
            const sellBtn = document.getElementById('btn-sell-player');

            const maxRating = player.isLegend ? 110 : 105;
            if (player.rating >= maxRating) {
                trainBtn.innerText = `育成完了 (MAX ${maxRating})`;
                trainBtn.disabled = true;
            } else {
                trainBtn.innerText = `育成 ($${trainCost}M) OVR+1`;
                trainBtn.disabled = gameState.funds < trainCost || gameState.isMatchRunning;
            }

            // ケガ・出場停止中の場合は放出不可に制御
            if (isPlayerUnavailable(player)) {
                sellBtn.innerText = `離脱中 (放出不可)`;
                sellBtn.disabled = true;
            } else {
                sellBtn.innerText = `放出 ($${sellPrice}M)${offerTxt}`;
                sellBtn.disabled = gameState.isMatchRunning;
            }
        }

        function attachDragEvents(element, type, index) {
            element.ondragstart = (e) => { 
                e.stopPropagation();
                draggedSource = { type, index };
                e.dataTransfer.setData('text/plain', JSON.stringify({ type, index }));
                e.dataTransfer.effectAllowed = 'move';
                element.classList.add('dragging'); 
            };
            element.ondragend = (e) => {
                element.classList.remove('dragging');
                draggedSource = null;
            };
            element.ondragover = (e) => { 
                e.preventDefault(); 
                e.stopPropagation(); 
                e.dataTransfer.dropEffect = 'move';
                element.classList.add('drag-over'); 
            };
            element.ondragleave = (e) => { 
                e.stopPropagation(); 
                element.classList.remove('drag-over'); 
            };
            element.ondrop = (e) => {
                e.preventDefault(); 
                e.stopPropagation(); 
                element.classList.remove('drag-over');
                
                if (draggedSource) {
                    if (draggedSource.type !== type || draggedSource.index !== index) {
                        swapPlayers(draggedSource, { type, index });
                    }
                    draggedSource = null;
                    selectedPlayer = null;
                    updateUI();
                }
            };
        }

        function attachContainerDragEvents(containerEl, targetType) {
            containerEl.ondragover = (e) => { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move';
            };
            containerEl.ondrop = (e) => {
                if (e.target.closest('.player-card')) return;
                e.preventDefault();
                if (draggedSource) {
                    let targetList = getList(targetType);
                    if (targetList.length > 0) {
                        let targetIndex = targetList.length - 1;
                        if (draggedSource.type !== targetType || draggedSource.index !== targetIndex) {
                            swapPlayers(draggedSource, { type: targetType, index: targetIndex });
                        }
                    }
                    draggedSource = null;
                    selectedPlayer = null;
                    updateUI();
                }
            };
        }

        function handlePlayerClick(type, index) {
            if (gameState.isMatchRunning) return;

            if (selectedPlayer && selectedPlayer.type === type && selectedPlayer.index === index) {
                selectedPlayer = null;
            } else {
                selectedPlayer = { type, index };
            }
            updateUI();
        }

        function trainSelectedPlayer() {
            if (!selectedPlayer || gameState.isMatchRunning) return;

            const list = getList(selectedPlayer.type);
            const player = list[selectedPlayer.index];
            if (!player) return;

            const trainCost = Math.floor(player.rating * 2);

            const maxRating = player.isLegend ? 110 : 105;
            if (player.rating >= maxRating) {
                alert(`この選手は既に最高総合値(${maxRating})に達しています。`);
                return;
            }

            if (gameState.funds < trainCost) {
                alert(`資金が足りません。(必要資金: $${trainCost}M)`);
                return;
            }

            gameState.funds -= trainCost;
            player.rating += 1;
            updateUI();
        }

        function sellSelectedPlayer() {
            if (!selectedPlayer || gameState.isMatchRunning) return;
            
            const list = getList(selectedPlayer.type);
            const player = list[selectedPlayer.index];

            if (isPlayerUnavailable(player)) {
                alert("ケガまたは出場停止中の選手は離脱期間が終了するまで放出できません。");
                return;
            }

            const totalPlayers = myStarters.length + myBench.length + myReserves.length;
            if (totalPlayers <= 16) {
                alert("試合可能人数 (16人: スタメン11名 + ベンチ5名) を下回るため、これ以上選手を放出できません。");
                return;
            }

            const mult = gameState.saleOffer ? 1.5 : 1.0;
            const sellPrice = Math.floor(player.rating * 8 * mult);

            if (confirm(`${player.name} を $${sellPrice}M で放出しますか？`)) {
                list.splice(selectedPlayer.index, 1);
                gameState.funds += sellPrice;
                
                fillSquadGaps();
                selectedPlayer = null;
                updateUI();
            }
        }

        function fillSquadGaps() {
            while (myStarters.length < 11 && myBench.length > 0) {
                myStarters.push(myBench.shift());
            }
            while (myBench.length < 5 && myReserves.length > 0) {
                myBench.push(myReserves.shift());
            }
        }

        function swapPlayers(src, target) {
            let list1 = getList(src.type), list2 = getList(target.type);
            let temp = list1[src.index];
            list1[src.index] = list2[target.index];
            list2[target.index] = temp;
        }

        function getList(type) { return type === 'starter' ? myStarters : (type === 'bench' ? myBench : myReserves); }

        function getPkKickerName(playerList, teamName) {
            const targetName = typeof teamPkKickerMap !== 'undefined' ? teamPkKickerMap[teamName] : null;
            if (targetName) {
                const found = playerList.find(p => p.name === targetName || p.name.includes(targetName));
                if (found) return found.name;
            }
            if (playerList && playerList.length > 0) {
                let best = playerList[0];
                for (let p of playerList) {
                    if (p.rating > best.rating) best = p;
                }
                return best.name;
            }
            return targetName || "PKキッカー";
        }

        function calculateWinRates(myRating, enemyBaseRating) {
            const isHome = (gameState.week % 2 === 1);
            const myEffRating = isHome ? myRating + 3 : myRating - 3;
            
            const weekEnemyBonus = Math.floor((gameState.week - 1) * 0.8);
            const enemyRating = enemyBaseRating + weekEnemyBonus;

            const diff = myEffRating - enemyRating;

            let win = Math.max(5, Math.min(90, Math.round(40 + diff * 3.5)));
            let draw = Math.max(10, 25 - Math.round(Math.abs(diff)));
            let loss = 100 - win - draw;

            return { win, draw, loss, effectiveEnemyRating: enemyRating };
        }

        function updateWinRatesUI(myRating, enemyBaseRating) {
            const rates = calculateWinRates(myRating, enemyBaseRating);

            document.getElementById('rate-win-txt').innerText = rates.win;
            document.getElementById('rate-draw-txt').innerText = rates.draw;
            document.getElementById('rate-loss-txt').innerText = rates.loss;
            document.getElementById('bar-win').style.width = rates.win + '%';
            document.getElementById('bar-draw').style.width = rates.draw + '%';
            document.getElementById('bar-loss').style.width = rates.loss + '%';
            document.getElementById('enemy-rating').innerText = rates.effectiveEnemyRating;
        }

        function selectScorerByProbability(playerList, matchReds = {}) {
            let available = playerList.filter(p => !matchReds[p.name]);
            if (available.length === 0) available = playerList;

            const rand = Math.random() * 100;
            let targetCategory = "FW";
            if (rand < 59) {
                targetCategory = "FW";
            } else if (rand < 89) {
                targetCategory = "MF";
            } else if (rand < 99) {
                targetCategory = "DF";
            } else {
                targetCategory = "GK";
            }

            let candidates = available.filter(p => p.category === targetCategory);
            if (candidates.length === 0) {
                candidates = available;
            }

            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function startMatchSimulation() {
            if (gameState.week > 20) {
                alert("今シーズン（全20節）は終了しました。");
                return;
            }
            if (gameState.isMatchRunning) return;

            autoFixSquadForUnavailable();

            gameState.isMatchRunning = true;
            document.getElementById('btn-start-match').disabled = true;

            document.getElementById('score-my').innerText = '0';
            document.getElementById('score-enemy').innerText = '0';
            document.getElementById('match-timer').innerText = '00:00';

            const isHome = (gameState.week % 2 === 1);
            let myRating = calculateStarterRating();
            
            const enemyTeams = standings.filter(s => !s.isUser);
            const enemy = enemyTeams[(gameState.week - 1) % enemyTeams.length];
            const enemyPreset = clubPresetData[enemy.name] || [];

            const rates = calculateWinRates(myRating, enemy.rating);

            const rand = Math.random() * 100;
            let myFinal = 0, enemyFinal = 0;

            if (rand < rates.win) {
                myFinal = Math.floor(Math.random() * 3) + 1;
                enemyFinal = Math.floor(Math.random() * myFinal);
            } else if (rand < rates.win + rates.draw) {
                myFinal = Math.floor(Math.random() * 3);
                enemyFinal = myFinal;
            } else {
                enemyFinal = Math.floor(Math.random() * 3) + 1;
                myFinal = Math.floor(Math.random() * enemyFinal);
            }

            let minute = 0, myScore = 0, enemyScore = 0;
            let matchContributors = {};
            let matchYellows = {};
            let matchReds = {};

            const logBox = document.getElementById('match-log');
            logBox.innerHTML = `<div class="log-entry">【第${gameState.week}節 (${isHome ? 'HOME' : 'AWAY'})】 キックオフ！</div>`;

            const timer = setInterval(() => {
                minute += 5;
                document.getElementById('match-timer').innerText = `${String(minute).padStart(2, '0')}:00`;

                /* 修正: PK確率を 0.04 -> 0.008 に大幅低減 */
                if (Math.random() < 0.008 && myScore < myFinal) {
                    let kicker = getPkKickerName(myStarters, gameState.teamName);
                    const isStopped = Math.random() < (1 / 6);
                    if (!isStopped) {
                        myScore++;
                        document.getElementById('score-my').innerText = myScore;
                        getStat(kicker, gameState.teamName).goals++;
                        matchContributors[kicker] = (matchContributors[kicker] || 0) + 3;
                        logBox.innerHTML += `<div class="log-entry log-goal">🎯 ${minute}分: PK獲得！キッカーは${kicker}... 決めた！GOAL!! [${gameState.teamName}]</div>`;
                    } else {
                        logBox.innerHTML += `<div class="log-entry" style="color:var(--accent-red);">⚠️ ${minute}分: [${gameState.teamName}] PK獲得！キッカー${kicker}のシュートは相手GKに防がれた！</div>`;
                    }
                } 
                else if (Math.random() < (myFinal / 18) && myScore < myFinal) {
                    myScore++;
                    document.getElementById('score-my').innerText = myScore;
                    let scorerObj = selectScorerByProbability(myStarters, matchReds);
                    let scorer = scorerObj.name;
                    getStat(scorer, gameState.teamName).goals++;
                    matchContributors[scorer] = (matchContributors[scorer] || 0) + 3;

                    let assistTxt = "";
                    if (Math.random() < 0.7) {
                        let assisterCandidates = myStarters.filter(p => p.name !== scorer && !matchReds[p.name]);
                        if (assisterCandidates.length > 0) {
                            let assister = assisterCandidates[Math.floor(Math.random() * assisterCandidates.length)].name;
                            getStat(assister, gameState.teamName).assists++;
                            matchContributors[assister] = (matchContributors[assister] || 0) + 1.5;
                            assistTxt = ` (アシスト: ${assister})`;
                        }
                    }
                    logBox.innerHTML += `<div class="log-entry log-goal">⚽ ${minute}分: GOAL!! [${gameState.teamName}] ${scorer}${assistTxt}</div>`;
                }

                /* 修正: PK確率を 0.04 -> 0.008 に大幅低減 */
                if (Math.random() < 0.008 && enemyScore < enemyFinal) {
                    let kicker = getPkKickerName(enemyPreset, enemy.name);
                    const isStopped = Math.random() < (1 / 6);
                    if (!isStopped) {
                        enemyScore++;
                        document.getElementById('score-enemy').innerText = enemyScore;
                        getStat(kicker, enemy.name).goals++;
                        matchContributors[kicker] = (matchContributors[kicker] || 0) + 3;
                        logBox.innerHTML += `<div class="log-entry log-goal">🎯 ${minute}分: PK献上... キッカー${kicker}に決められた！GOAL!! [${enemy.name}]</div>`;
                    } else {
                        logBox.innerHTML += `<div class="log-entry" style="color:var(--accent-blue);">🔥 ${minute}分: [${enemy.name}] にPKを与えるも、我がチームのGKが見事にPKストップ！！</div>`;
                    }
                } 
                else if (Math.random() < (enemyFinal / 18) && enemyScore < enemyFinal) {
                    enemyScore++;
                    document.getElementById('score-enemy').innerText = enemyScore;
                    let scorerObj = selectScorerByProbability(enemyPreset.slice(0, 11), matchReds);
                    let scorer = scorerObj ? scorerObj.name : "相手FW";
                    getStat(scorer, enemy.name).goals++;
                    matchContributors[scorer] = (matchContributors[scorer] || 0) + 3;

                    let assistTxt = "";
                    if (Math.random() < 0.7 && enemyPreset.length > 1) {
                        let assisterCandidates = enemyPreset.slice(0, 11).filter(p => p.name !== scorer && !matchReds[p.name]);
                        if (assisterCandidates.length > 0) {
                            let assister = assisterCandidates[Math.floor(Math.random() * assisterCandidates.length)].name;
                            getStat(assister, enemy.name).assists++;
                            matchContributors[assister] = (matchContributors[assister] || 0) + 1.5;
                            assistTxt = ` (アシスト: ${assister})`;
                        }
                    }
                    logBox.innerHTML += `<div class="log-entry log-goal">⚽ ${minute}分: GOAL!! [${enemy.name}] ${scorer}${assistTxt}</div>`;
                }

                if (Math.random() < 0.08) {
                    const isMyCard = Math.random() < 0.5;
                    const isRed = Math.random() < 0.1;
                    let pName = "", pTeam = "";

                    if (isMyCard) {
                        let availablePlayers = myStarters.filter(p => !matchReds[p.name]);
                        if (availablePlayers.length > 0) {
                            let pObj = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];
                            pName = pObj.name;
                            pTeam = gameState.teamName;

                            if (isRed) {
                                matchReds[pName] = true;
                                getStat(pName, pTeam).red++;
                                pObj.suspendedWeeks = 2;
                                logBox.innerHTML += `<div class="log-entry log-card-red">🟥 ${minute}分: 警告(一発退場!) [${pTeam}] ${pName}</div>`;
                            } else {
                                matchYellows[pName] = (matchYellows[pName] || 0) + 1;
                                getStat(pName, pTeam).yellow++;
                                if (matchYellows[pName] === 2) {
                                    matchReds[pName] = true;
                                    getStat(pName, pTeam).red++;
                                    pObj.suspendedWeeks = 2;
                                    logBox.innerHTML += `<div class="log-entry log-card-red">🟨🟥 ${minute}分: 警告(2枚目のイエローで退場!) [${pTeam}] ${pName}</div>`;
                                } else {
                                    logBox.innerHTML += `<div class="log-entry log-card-yellow">🟨 ${minute}分: 警告(イエローカード) [${pTeam}] ${pName}</div>`;
                                }
                            }
                        }
                    } else {
                        let availablePlayers = enemyPreset.slice(0, 11).filter(p => !matchReds[p.name]);
                        if (availablePlayers.length > 0) {
                            let pObj = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];
                            pName = pObj.name;
                            pTeam = enemy.name;

                            if (isRed) {
                                matchReds[pName] = true;
                                getStat(pName, pTeam).red++;
                                logBox.innerHTML += `<div class="log-entry log-card-red">🟥 ${minute}分: 警告(一発退場!) [${pTeam}] ${pName}</div>`;
                            } else {
                                matchYellows[pName] = (matchYellows[pName] || 0) + 1;
                                getStat(pName, pTeam).yellow++;
                                if (matchYellows[pName] === 2) {
                                    matchReds[pName] = true;
                                    getStat(pName, pTeam).red++;
                                    logBox.innerHTML += `<div class="log-entry log-card-red">🟨🟥 ${minute}分: 警告(2枚目のイエローで退場!) [${pTeam}] ${pName}</div>`;
                                } else {
                                    logBox.innerHTML += `<div class="log-entry log-card-yellow">🟨 ${minute}分: 警告(イエローカード) [${pTeam}] ${pName}</div>`;
                                }
                            }
                        }
                    }
                }

                logBox.scrollTop = logBox.scrollHeight;

                if (minute >= 90) {
                    clearInterval(timer);
                    finishMatch(myScore, enemyScore, enemy.name, matchContributors);
                }
            }, 80);
        }

        function getStaminaLoss(player) {
            let baseLoss = 20;
            const cat = player.category || "FW";
            if (cat === "FW") baseLoss = 20;
            else if (cat === "MF") baseLoss = 18;
            else if (cat === "DF") baseLoss = 15;
            else if (cat === "GK") baseLoss = 5;

            if (player.isLegend) {
                baseLoss = Math.max(0, baseLoss - 4);
            }
            return baseLoss;
        }

        function finishMatch(myGoals, enemyGoals, enemyName, matchContributors) {
            const logBox = document.getElementById('match-log');

            /* 修正: ケガの発生条件を「スタミナ20未満かつ低確率」に引き下げ */
            myStarters.forEach(p => {
                ensurePlayerDefaults(p);
                const loss = getStaminaLoss(p);
                p.stamina = Math.max(0, p.stamina - loss);

                if (p.stamina < 20 && p.injuryWeeks === 0) {
                    const injuryProb = (20 - p.stamina) * 0.005; // 低確率（最大約10%未満）
                    if (Math.random() < injuryProb) {
                        p.injuryWeeks = Math.floor(Math.random() * 2) + 2; 
                        logBox.innerHTML += `<div class="log-entry log-card-red">🚑 負傷: [${gameState.teamName}] ${p.name} がアクシデントにより負傷離脱（${p.injuryWeeks - 1}節出場不可）</div>`;
                    }
                }
            });

            myBench.forEach(p => {
                ensurePlayerDefaults(p);
                p.stamina = Math.min(100, p.stamina + 25);
            });
            myReserves.forEach(p => {
                ensurePlayerDefaults(p);
                p.stamina = Math.min(100, p.stamina + 25);
            });

            [...myStarters, ...myBench, ...myReserves].forEach(p => {
                if (p.suspendedWeeks > 0) p.suspendedWeeks--;
                if (p.injuryWeeks > 0) p.injuryWeeks--;
            });

            let myStat = standings.find(s => s.isUser);
            let enemyStat = standings.find(s => s.name === enemyName);

            myStat.played++; enemyStat.played++;
            myStat.gf += myGoals; myStat.ga += enemyGoals; myStat.gd = myStat.gf - myStat.ga;
            enemyStat.gf += enemyGoals; enemyStat.ga += myGoals; enemyStat.gd = enemyStat.gf - enemyStat.ga;

            let matchComment = "";

            if (myGoals > enemyGoals) {
                myStat.win++; myStat.points += 3; enemyStat.loss++; gameState.funds += 500;
                matchComment = "素晴らしい勝利！攻守がかみ合った見事なゲームプランでした。";
            } else if (myGoals < enemyGoals) {
                myStat.loss++; enemyStat.win++; enemyStat.points += 3; gameState.funds += 100;
                matchComment = "悔しい敗戦。次節に向けて守備の修正が急務です。";
            } else {
                myStat.draw++; myStat.points += 1; enemyStat.draw++; enemyStat.points += 1; gameState.funds += 300;
                matchComment = "互角の攻防の末に引き分け。勝ち点1を分け合いました。";
            }

            let momName = "該当者なし";
            let maxContrib = -1;
            Object.keys(matchContributors).forEach(pName => {
                if (matchContributors[pName] > maxContrib) {
                    maxContrib = matchContributors[pName];
                    momName = pName;
                }
            });
            if (maxContrib <= 0) {
                momName = myGoals >= enemyGoals ? myStarters[0].name : (clubPresetData[enemyName] ? clubPresetData[enemyName][0].name : "GK");
            }

            logBox.innerHTML += `
                <div class="log-entry log-summary">
                    【試合終了】 ${gameState.teamName} ${myGoals} - ${enemyGoals} ${enemyName}<br>
                    ★ MOM: ${momName}<br>
                    💬 総括: ${matchComment}
                </div>
            `;
            
            const otherResults = simulateOtherMatches(enemyName);
            logBox.innerHTML += otherResults;

            sortStandings();

            /* 追加: 全20節終了時の順位賞金 ＆ 優勝イベント処理 */
            if (gameState.week === 20) {
                const champion = standings[0];
                const myRankIndex = standings.findIndex(s => s.isUser); // 0始まり (0 = 1位)
                const prize = Math.max(0, 6000 - (myRankIndex * 500)); // 1位: $6000M, 2位: $5500M ...
                
                gameState.funds += prize;

                let championshipEventText = "";
                if (myRankIndex === 0) {
                    // 優勝イベント発生
                    gameState.buyOffer = true;
                    gameState.buyOfferWeeks = 5; // 獲得セール5節分確定付与
                    championshipEventText = `<br>🎉 **【特別優勝イベント発生】** 欧州王者の名声により世界中のスカウトから注目され、**獲得オファー（全選手30%OFF）**が5節継続で発生！`;
                }

                logBox.innerHTML += `
                    <div class="log-entry log-summary" style="color:var(--accent-gold); font-size:1.05em; border-top:2px solid var(--accent-gold);">
                        🏆 リーグ全20節が終了しました！<br>
                        【最終結果】 優勝: ${champion.name} (勝ち点:${champion.points})<br>
                        📊 自クラブ順位: ${myRankIndex + 1}位 / 💰 順位賞金: +$${prize}M を獲得！
                        ${championshipEventText}
                    </div>
                `;

                if (champion.isUser) {
                    alert(`🎉 おめでとうございます！ ${gameState.teamName} が欧州スーパーリーグ優勝を果たしました！\n🏆 順位賞金 $${prize}M を獲得！特別獲得オファーが発生中です！`);
                } else {
                    alert(`今シーズン終了！ ${myRankIndex + 1}位 でフィニッシュ（順位賞金 $${prize}M 獲得）。優勝は ${champion.name} でした。`);
                }
            }

            logBox.scrollTop = logBox.scrollHeight;

            if (gameState.week < 20) {
                gameState.week++;
            } else {
                gameState.week = 20;
            }

            updateSpecialOffers();
            gameState.isMatchRunning = false;
            document.getElementById('btn-start-match').disabled = (gameState.week >= 20);
            updateUI();
        }

        function sortStandings() {
            standings.sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.gd !== a.gd) return b.gd - a.gd;
                if (b.gf !== a.gf) return b.gf - a.gf;
                if (b.win !== a.win) return b.win - a.win;
                return a.name.localeCompare(b.name, 'ja');
            });
        }

        function updateSpecialOffers() {
            if (gameState.saleOfferWeeks > 0) {
                gameState.saleOfferWeeks--;
                if (gameState.saleOfferWeeks === 0) gameState.saleOffer = false;
            }
            if (gameState.buyOfferWeeks > 0) {
                gameState.buyOfferWeeks--;
                if (gameState.buyOfferWeeks === 0) gameState.buyOffer = false;
            }

            if (!gameState.saleOffer && Math.random() < 0.25) {
                gameState.saleOffer = true;
                gameState.saleOfferWeeks = Math.floor(Math.random() * 2) + 1;
            }
            if (!gameState.buyOffer && Math.random() < 0.25) {
                gameState.buyOffer = true;
                gameState.buyOfferWeeks = Math.floor(Math.random() * 2) + 1;
            }

            if (Math.random() < 0.25) {
                gameState.merchOffer = true;
                gameState.funds += 500;
            } else {
                gameState.merchOffer = false;
            }
        }

        function renderOfferBanner() {
            const banner = document.getElementById('offer-banner');
            let html = '';
            if (gameState.saleOffer) {
                html += `<div style="background:rgba(239, 68, 68, 0.2); border:1px solid var(--accent-red); color:var(--accent-red); padding:6px 10px; border-radius:6px; font-size:0.75em; font-weight:bold; margin-bottom:6px;">🔥 放出オファー発生中！ 選手放出時の獲得金が 1.5倍 にアップ！ (残り${gameState.saleOfferWeeks}節)</div>`;
            }
            if (gameState.buyOffer) {
                html += `<div style="background:rgba(16, 185, 129, 0.2); border:1px solid var(--accent-green); color:var(--accent-green); padding:6px 10px; border-radius:6px; font-size:0.75em; font-weight:bold; margin-bottom:6px;">🎉 獲得セールオファー発生中！ 移籍市場の契約費用が 30% OFF！ (残り${gameState.buyOfferWeeks}節)</div>`;
            }
            if (gameState.merchOffer) {
                html += `<div style="background:rgba(59, 130, 246, 0.2); border:1px solid var(--accent-blue); color:var(--accent-blue); padding:6px 10px; border-radius:6px; font-size:0.75em; font-weight:bold; margin-bottom:6px;">🛍️ グッズ爆売れイベント発生！ グッズ収入として +$500M 獲得しました！</div>`;
            }
            banner.innerHTML = html;
        }

        function simulateOtherMatches(enemyName) {
            let otherTeams = standings.filter(s => !s.isUser && s.name !== enemyName);
            otherTeams.sort(() => Math.random() - 0.5);
            
            let otherResultsHtml = '<div class="log-entry log-summary" style="color:var(--text-main);">【他会場の試合結果】</div>';

            for (let i = 0; i < otherTeams.length; i += 2) {
                if (i + 1 >= otherTeams.length) break;
                let t1 = otherTeams[i];
                let t2 = otherTeams[i+1];
                
                let t1Roll = t1.rating + (Math.random() * 16 - 8);
                let t2Roll = t2.rating + (Math.random() * 16 - 8);

                let t1Final = 0, t2Final = 0;
                if (t1Roll > t2Roll + 2) { t1Final = Math.floor(Math.random() * 3) + 1; t2Final = Math.floor(Math.random() * t1Final); }
                else if (t1Roll < t2Roll - 2) { t2Final = Math.floor(Math.random() * 3) + 1; t1Final = Math.floor(Math.random() * t2Final); }
                else { t1Final = Math.floor(Math.random() * 2); t2Final = t1Final; }

                processOtherMatchStats(t1, t1Final, t2, t2Final);

                t1.played++; t2.played++;
                t1.gf += t1Final; t1.ga += t2Final; t1.gd = t1.gf - t1.ga;
                t2.gf += t2Final; t2.ga += t1Final; t2.gd = t2.gf - t2.ga;

                if (t1Final > t2Final) { t1.win++; t1.points += 3; t2.loss++; } 
                else if (t1Final < t2Final) { t2.win++; t2.points += 3; t1.loss++; } 
                else { t1.draw++; t1.points += 1; t2.draw++; t2.points += 1; }

                otherResultsHtml += `<div class="log-entry">・ ${t1.name} ${t1Final} - ${t2Final} ${t2.name}</div>`;
            }
            return otherResultsHtml;
        }

        function processOtherMatchStats(teamObj, goals, enemyTeamObj, enemyGoals) {
            let preset = clubPresetData[teamObj.name] || [];
            let presetEn = clubPresetData[enemyTeamObj.name] || [];

            for (let i = 0; i < goals; i++) {
                if (preset.length > 0) {
                    let scorer = selectScorerByProbability(preset.slice(0, 11));
                    getStat(scorer.name, teamObj.name).goals++;
                    if (Math.random() < 0.7 && preset.length > 1) {
                        let assisterCandidates = preset.slice(0, 11).filter(p => p.name !== scorer.name);
                        if (assisterCandidates.length > 0) {
                            let assister = assisterCandidates[Math.floor(Math.random() * assisterCandidates.length)];
                            getStat(assister.name, teamObj.name).assists++;
                        }
                    }
                }
            }

            for (let i = 0; i < enemyGoals; i++) {
                if (presetEn.length > 0) {
                    let scorer = selectScorerByProbability(presetEn.slice(0, 11));
                    getStat(scorer.name, enemyTeamObj.name).goals++;
                    if (Math.random() < 0.7 && presetEn.length > 1) {
                        let assisterCandidates = presetEn.slice(0, 11).filter(p => p.name !== scorer.name);
                        if (assisterCandidates.length > 0) {
                            let assister = assisterCandidates[Math.floor(Math.random() * assisterCandidates.length)];
                            getStat(assister.name, enemyTeamObj.name).assists++;
                        }
                    }
                }
            }
        }

        function switchViewTab(tab) {
            gameState.activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            updateView();
        }

        function updateView() {
            const container = document.getElementById('view-container');
            if (gameState.activeTab === 'standings') renderStandings();
            else if (gameState.activeTab === 'goals') renderGoalRankings();
            else if (gameState.activeTab === 'assists') renderAssistRankings();
            else if (gameState.activeTab === 'cards') renderCardRankings();
        }
