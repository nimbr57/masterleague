        function renderMarket() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';

            const category = gameState.marketCategory;

            if (category === 'MANAGER') {
                gameState.managerMarket.forEach((m, idx) => {
                    const canAfford = gameState.funds >= m.price;
                    const card = document.createElement('div');
                    card.className = 'market-card';
                    card.innerHTML = `
                        <div style="font-weight:bold;">👔 ${m.name}</div>
                        <div>OVR: <span style="color:var(--accent-gold);">${m.rating}</span></div>
                        <div style="margin-top:4px;">価格: $${m.price}M</div>
                        <button style="width:100%; margin-top:4px; font-size:0.75em; background:${canAfford ? 'var(--accent-blue)' : '#475569'};" 
                                ${canAfford ? '' : 'disabled'} 
                                onclick="buyManager(${idx})">招聘</button>
                    `;
                    grid.appendChild(card);
                });
                return;
            }

            // 自チーム所属選手および選択中クラブの全選手名を取得
            const myPlayerNames = new Set([
                ...myStarters.map(p => p.name),
                ...myBench.map(p => p.name),
                ...myReserves.map(p => p.name)
            ]);
            const currentTeamPreset = clubPresetData[gameState.teamName] || [];
            const currentTeamNames = new Set(currentTeamPreset.map(p => p.name));

            let filtered = transferMarket.filter(p => {
                // 選択中のクラブの選手、または自チーム内に既にいる選手は非表示
                if (currentTeamNames.has(p.name) || myPlayerNames.has(p.name) || p.team === gameState.teamName) {
                    return false;
                }
                if (category === 'ALL') return true;
                if (category === 'LEGEND') return p.isLegend;
                return p.category === category && !p.isLegend;
            });

            const discount = gameState.buyOffer ? 0.7 : 1.0;

            filtered.forEach((player, idx) => {
                const actualIndex = transferMarket.indexOf(player);
                const finalPrice = Math.floor(player.price * discount);
                const canAfford = gameState.funds >= finalPrice;
                const card = document.createElement('div');
                const glowClass = getCardGlowClass(player);
                card.className = `market-card ${glowClass}`;

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${player.nat || ''} ${player.name}</span>
                        <span class="rating-badge ${getRatingClass(player.rating)}">${player.rating}</span>
                    </div>
                    <div style="font-size:0.7em; color:var(--text-sub); margin-top:2px;">${player.pos} | ${player.category}</div>
                    <div style="margin-top:4px; font-weight:bold; color:var(--accent-green);">$${finalPrice}M ${gameState.buyOffer ? '<span style="font-size:0.7em; color:var(--accent-red);">(30%OFF)</span>' : ''}</div>
                    <button style="width:100%; margin-top:4px; font-size:0.75em; background:${canAfford ? 'var(--accent-green)' : '#475569'};" 
                            ${canAfford ? '' : 'disabled'} 
                            onclick="buyPlayer(${actualIndex})">獲得</button>
                `;
                grid.appendChild(card);
            });
        }

        function buyPlayer(index) {
            if (gameState.isMatchRunning) return;
            const player = transferMarket[index];
            if (!player) return;

            const discount = gameState.buyOffer ? 0.7 : 1.0;
            const price = Math.floor(player.price * discount);

            if (gameState.funds < price) {
                alert(`資金が足りません。(必要額: $${price}M)`);
                return;
            }

            if (confirm(`${player.name} を $${price}M で獲得しますか？`)) {
                gameState.funds -= price;
                transferMarket.splice(index, 1);
                
                ensurePlayerDefaults(player);
                myReserves.push(player);

                fillSquadGaps();
                updateUI();
            }
        }

        function renderManagerSelect() {
            const select = document.getElementById('manager-select');
            select.innerHTML = '';
            gameState.myManagers.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = m.name;
                if (gameState.manager && gameState.manager.name === m.name) opt.selected = true;
                select.appendChild(opt);
            });

            if (gameState.manager) {
                document.getElementById('manager-rating').innerText = `OVR:${gameState.manager.rating}`;
            }
        }

        function switchManager() {
            const idx = document.getElementById('manager-select').value;
            gameState.manager = gameState.myManagers[idx];
            updateUI();
        }

        function buyManager(index) {
            if (gameState.isMatchRunning) return;
            const m = gameState.managerMarket[index];
            if (!m) return;

            if (gameState.funds < m.price) {
                alert(`資金が足りません。(必要額: $${m.price}M)`);
                return;
            }

            if (confirm(`${m.name} 監督を $${m.price}M で招聘しますか？`)) {
                gameState.funds -= m.price;
                gameState.myManagers.push(m);
                gameState.manager = m;
                gameState.managerMarket.splice(index, 1);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('season').innerText = gameState.season;
            document.getElementById('week').innerText = gameState.week;
            document.getElementById('funds').innerText = gameState.funds;

            const teamSelect = document.getElementById('team-select');
            const isLeagueStarted = (gameState.week > 1 || gameState.season > 1);
            if (teamSelect) {
                teamSelect.disabled = isLeagueStarted;
                teamSelect.style.opacity = isLeagueStarted ? '0.5' : '1.0';
                teamSelect.style.cursor = isLeagueStarted ? 'not-allowed' : 'pointer';
            }

            const myRating = calculateStarterRating();
            document.getElementById('team-rating').innerText = myRating;
            document.getElementById('squad-team-rating').innerText = myRating;

            document.getElementById('my-team-disp').innerText = gameState.teamName;

            const enemyTeams = standings.filter(s => !s.isUser);
            if (enemyTeams.length > 0) {
                const enemy = enemyTeams[(gameState.week - 1) % enemyTeams.length];
                document.getElementById('enemy-name').innerText = enemy.name;
                const isHome = (gameState.week % 2 === 1);
                const vBadge = document.getElementById('venue-indicator');
                vBadge.innerText = isHome ? "HOME" : "AWAY";
                vBadge.className = `venue-badge ${isHome ? 'venue-home' : 'venue-away'}`;

                updateWinRatesUI(myRating, enemy.rating);
            }

            renderOfferBanner();
            renderSquad();
            renderManagerSelect();
            renderMarket();
            updateView();
            saveGameState();
        }

        window.onload = () => {
            initTheme();
            if (!loadGameState()) {
                selectMyTeam();
            } else {
                updateUI();
            }
        };
    </script>
</body>
</html>
